<figure>

    <text x="700" y="213" font-size="10" fill="currentColor" opacity=".55">연간 병원 방문 횟수 …</text>

<figcaption><strong>대화창이 &lsquo;읽는 곳&rsquo;에서 &lsquo;쓰는 곳&rsquo;으로 바뀌었습니다.</strong> 표·그래프·단추·입력칸이 답변 안에 그려지고, 숫자를 바꿔 다시 계산할 수 있습니다. 긴 설명을 읽기 힘들어하시던 어르신께 특히 큰 변화입니다.</figcaption>
