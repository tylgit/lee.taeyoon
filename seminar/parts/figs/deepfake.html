<figure>

<figcaption><strong>다섯 단계 중 어디서든 한 번만 끊으면 피해는 일어나지 않습니다.</strong> 사기범은 &lsquo;급하다&rsquo;는 감정으로 확인 절차를 건너뛰게 만드는 데 모든 것을 겁니다. 그래서 방어도 기술이 아니라 &lsquo;미리 정해둔 약속&rsquo; 하나면 충분합니다.</figcaption>
